# nginx du site vitrine (image nginxinc/nginx-unprivileged, utilisateur 101, port 8080).
# Remplace /etc/nginx/nginx.conf. Site 100 % statique, prérendu et précompressé (gzip_static).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/css text/plain text/xml application/javascript application/json image/svg+xml;

  # Dossiers temporaires accessibles en écriture à l'utilisateur non-root.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';
  access_log /dev/stdout main;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 1k;

  # Fichiers précompressés au build (scripts/precompress.sh) ; pas de compression à la volée.
  gzip off;
  gzip_static on;
  gzip_vary on;

  # Cache : assets à empreinte immuables 1 an (dont les SVG d'art /art/<nom>.<hash>.svg) ; HTML
  # et version.json toujours revalidés ; le reste (polices, images de static/) 1 jour.
  map $uri $cache_control {
    /healthz                        "no-store";
    ~^/_app/immutable/              "public, max-age=31536000, immutable";
    ~^/jouer/assets/                "public, max-age=31536000, immutable";
    "~^/art/[\w-]+\.[0-9a-f]{10}\.svg$" "public, max-age=31536000, immutable";
    ~^/_app/version\.json$          "no-cache";
    ~(\.html|/)$                    "no-cache";
    default                         "public, max-age=86400";
  }

  # Suivi d'un signalement (/suivi/, /en/suivi/) : le jeton est dans le fragment ; aucun Referer
  # n'est envoyé depuis ces pages (ARCHITECTURE §5 et §8, D10). Ailleurs : politique par défaut.
  map $uri $referrer_policy {
    ~^/(en/)?suivi(/|$)             "no-referrer";
    default                         "strict-origin-when-cross-origin";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Derrière le proxy Coolify : redirections relatives (pas de :8080 ni de http:// qui fuient).
    absolute_redirect off;
    port_in_redirect off;

    # $csp_script_hashes : empreintes des scripts en ligne de SvelteKit ; $csp_style_hashes : des
    # <style> en ligne (CSS des pages, art.css des SVG de /art/). Générés par scripts/csp-hashes.sh.
    # Les attributs style="" (variables CSS posées par les composants) relèvent de style-src-attr,
    # qui garde 'unsafe-inline' : une empreinte ne les couvrirait qu'avec 'unsafe-hashes'.
    include /etc/nginx/csp-hashes.conf;

    # connect-src : le service de signalement https://arbre-api.cardormedia.com (ARCHITECTURE §8),
    # sur le site (formulaire, suivi) comme sur /jouer/ ; img-src aussi (captures jointes, URL
    # signées du service, dans la fiche de suivi) et blob: (vignettes des captures avant envoi).
    # /jouer/ : le jeu web (SPA Vite) a sa propre politique, alignée sur sa balise <meta> (blob:
    # pour l'export de sauvegarde, aucun script en ligne).
    set $csp "default-src 'self'; script-src 'self' $csp_script_hashes; style-src 'self' $csp_style_hashes; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://arbre-api.cardormedia.com; font-src 'self'; media-src 'self'; connect-src 'self' https://arbre-api.cardormedia.com; manifest-src 'self'; worker-src 'self'; frame-src https://itch.io https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    if ($uri ~ ^/jouer/) {
      set $csp "default-src 'self'; script-src 'self'; style-src 'self' $csp_style_hashes; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://arbre-api.cardormedia.com; font-src 'self'; media-src 'self' blob:; connect-src 'self' https://arbre-api.cardormedia.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests";
    }

    # En-têtes définis une seule fois ici (aucun add_header dans les location : pas d'écrasement).
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy $referrer_policy always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ancien domaine : tout vers arbre.cardormedia.com (la sonde Coolify passe par 127.0.0.1).
    if ($host = arbre.fs0ciety.org) {
      return 301 https://arbre.cardormedia.com$request_uri;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Pas de fichiers cachés (.git, .env…) ni de sources de précompression demandées directement.
    location ~ /\. {
      return 404;
    }

    location / {
      try_files $uri $uri/ =404;
    }

    # 404 propre : la page 404.html du site si elle existe, sinon un texte court (jamais la page
    # par défaut de nginx).
    error_page 404 /404.html;
    location = /404.html {
      internal;
      try_files /404.html @not_found;
    }
    location @not_found {
      default_type text/html;
      return 404 '<!doctype html><html lang="fr"><meta charset="utf-8"><title>Page introuvable</title><p>Page introuvable. <a href="/">Retour à l’accueil</a></p></html>\n';
    }

    # Site anglais (/en/, mêmes slugs, D8) : sa propre 404 (/en/404.html prérendue), sinon un texte
    # court en anglais.
    location /en/ {
      error_page 404 /en/404.html;
      try_files $uri $uri/ =404;
    }
    location = /en/404.html {
      internal;
      try_files /en/404.html @not_found_en;
    }
    location @not_found_en {
      default_type text/html;
      return 404 '<!doctype html><html lang="en"><meta charset="utf-8"><title>Page not found</title><p>Page not found. <a href="/en/">Back to the home page</a></p></html>\n';
    }
  }
}
