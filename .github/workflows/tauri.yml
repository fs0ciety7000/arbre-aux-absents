name: Tauri (builds natifs)

on:
  push:
    tags: ['v*']
    # Avant la fusion sur main (workflow_dispatch n'existe qu'une fois le fichier sur la branche
    # par défaut) : un commit dont le message contient « [tauri] » sur une branche claude/**.
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false

jobs:
  # Sur un tag v* : une release BROUILLON, complétée par les jobs suivants, publiée à la main.
  # En lancement manuel : pas de release, seulement des artefacts de workflow.
  release:
    name: release brouillon
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
                 --title "L'Arbre aux absents $TAG" --generate-notes
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: desktop (${{ matrix.name }})
    needs: release
    if: >-
      ${{ !cancelled() && needs.release.result != 'failure' &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[tauri]')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - name: windows
            platform: windows-latest
            args: ''
            rust-targets: ''
          - name: macos-universal
            platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/game/src-tauri -> target
          key: ${{ matrix.name }}
      - name: Dépendances système (Linux, GStreamer pour bundleMediaFramework)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf file \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      # Signature macOS : seulement si les secrets existent (sinon build non signé, Gatekeeper
      # avertira). Une variable vide ferait échouer le bundler : on ne les exporte que remplies.
      - name: Signature macOS (optionnelle)
        if: matrix.name == 'macos-universal'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
            done
            echo "Signature et notarisation macOS activées."
          else
            echo "::notice::Secrets Apple absents : build macOS non signé."
          fi
      - run: npm ci
      - name: Build Tauri
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/game
          tauriScript: npm run tauri --
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            apps/game/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/game/src-tauri/target/release/bundle/deb/*.deb
            apps/game/src-tauri/target/release/bundle/rpm/*.rpm
            apps/game/src-tauri/target/release/bundle/nsis/*.exe
            apps/game/src-tauri/target/release/bundle/msi/*.msi
            apps/game/src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  android:
    name: android (APK/AAB)
    needs: release
    if: >-
      ${{ !cancelled() && needs.release.result != 'failure' &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[tauri]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/game/src-tauri -> target
          key: android
      - run: npm ci
      - name: Secrets de signature présents ?
        id: signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEY_ALIAS" ] \
             && [ -n "$ANDROID_KEY_PASSWORD" ] && [ -n "$ANDROID_STORE_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets Android absents : APK debug seulement (non publiable)."
          fi
      # gen/android n'est pas versionné : il est régénéré ici, puis reçoit les icônes.
      - name: Projet Android (tauri android init)
        working-directory: apps/game
        run: |
          npm run tauri -- android init --ci
          npm run tauri:icons
      - name: Version
        id: version
        run: echo "value=$(node -p "require('./apps/game/package.json').version")" >> "$GITHUB_OUTPUT"
      # versionCode : numéro d'exécution (strictement croissant, exigé par le Play Store).
      - name: Build release (non signé) + signature
        if: steps.signing.outputs.signed == 'true'
        working-directory: apps/game
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          npm run tauri -- android build --apk --aab \
            --config '{"bundle":{"android":{"versionCode":${{ github.run_number }}}}}'
          bash ../../scripts/android-sign.sh src-tauri/gen/android ../../android-out "${{ steps.version.outputs.value }}"
      - name: Build debug (APK non publiable)
        if: steps.signing.outputs.signed != 'true'
        working-directory: apps/game
        run: |
          npm run tauri -- android build --apk --debug \
            --config '{"bundle":{"android":{"versionCode":${{ github.run_number }}}}}'
          mkdir -p ../../android-out
          find src-tauri/gen/android/app/build/outputs/apk -name '*-debug.apk' \
            -exec cp {} "../../android-out/arbre-aux-absents-${{ steps.version.outputs.value }}-debug.apk" \;
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android-out/
          if-no-files-found: error
          retention-days: 14
      - name: Ajout à la release brouillon
        if: needs.release.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" android-out/* --repo "$GITHUB_REPOSITORY" --clobber
