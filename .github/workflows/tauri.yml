name: Tauri (builds natifs)

on:
  push:
    tags: ['v*']
    # Avant la fusion sur main (workflow_dispatch n'existe qu'une fois le fichier sur la branche
    # par défaut) : un commit dont le message contient « [tauri] » sur une branche claude/**.
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false

jobs:
  # Release GitHub (D18, DEPLOYMENT §3) : sur un tag v*, ou sur un commit de publication
  # « [itch] » (une session Claude ne peut pas pousser de tag). Créée en BROUILLON (tag vX.Y.Z
  # = version du jeu, notes tirées de content/changelog.json), complétée par desktop et android,
  # puis publiée « latest » par le job `publish` : c'est elle que lit la mise à jour automatique
  # (…/releases/latest/download/latest.json). Sans les secrets TAURI_SIGNING_* : aucune release
  # sur un commit, brouillon à publier à la main sur un tag (comme avant), builds sans updater.
  # En lancement manuel : pas de release, seulement des artefacts de workflow.
  release:
    name: release (brouillon)
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[itch]') }}
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.meta.outputs.tag }}
      updater: ${{ steps.meta.outputs.updater }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node -p "require('./apps/game/package.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version du jeu ($tag)."
            exit 1
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            updater=true
          else
            updater=false
            echo "::notice::Secrets TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD absents : builds sans mise à jour automatique, aucune release publiée."
          fi
          { echo "version=$version"; echo "tag=$tag"; echo "updater=$updater"; } >> "$GITHUB_OUTPUT"
      - id: create
        if: steps.meta.outputs.updater == 'true' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          # Brouillons compris (l'API par tag ne les voit pas).
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0] // empty | \"\(.id) \(.draft)\"")
          if [ -n "$found" ] && [ "${found#* }" != true ]; then
            echo "::notice::Release $TAG déjà publiée : rien n'y est ajouté (changer la version pour publier)."
            exit 0
          fi
          if [ -z "$found" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "L'Arbre aux absents $TAG" --notes-file "$RUNNER_TEMP/notes.md"
            found=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"$TAG\")][0] // empty | \"\(.id) \(.draft)\"")
          fi
          echo "id=${found%% *}" >> "$GITHUB_OUTPUT"

  desktop:
    name: desktop (${{ matrix.name }})
    needs: release
    if: >-
      ${{ !cancelled() && needs.release.result != 'failure' &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[tauri]') ||
      contains(github.event.head_commit.message, '[itch]')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - name: windows
            platform: windows-latest
            args: ''
            rust-targets: ''
          - name: macos-universal
            platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/game/src-tauri -> target
          key: ${{ matrix.name }}
      - name: Dépendances système (Linux, GStreamer pour bundleMediaFramework)
        if: matrix.name == 'linux'
        # L'image ubuntu-22.04 préinstalle libunwind-14-dev, incompatible avec libunwind-dev
        # (dépendance de libgstreamer1.0-dev) : on le retire avant l'installation.
        run: |
          sudo apt-get remove -y libunwind-14-dev
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf file \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      # Signature macOS : seulement si les secrets existent (sinon build non signé, Gatekeeper
      # avertira). Une variable vide ferait échouer le bundler : on ne les exporte que remplies.
      - name: Signature macOS (optionnelle)
        if: matrix.name == 'macos-universal'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
            done
            echo "Signature et notarisation macOS activées."
          else
            echo "::notice::Secrets Apple absents : build macOS non signé."
          fi
      # Mise à jour automatique (D18) : artefacts signés (minisign) seulement si les deux secrets
      # existent ; sinon build normal, sans latest.json (même schéma que la signature macOS).
      - name: Signature des mises à jour (optionnelle)
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<__ARBRE_KEY__"
              echo "$TAURI_SIGNING_PRIVATE_KEY"
              echo "__ARBRE_KEY__"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<__ARBRE_KEY__"
              echo "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
              echo "__ARBRE_KEY__"
            } >> "$GITHUB_ENV"
            echo "args=--config '{\"bundle\":{\"createUpdaterArtifacts\":true}}'" >> "$GITHUB_OUTPUT"
            echo "Artefacts de mise à jour signés."
          else
            echo "::notice::Secrets TAURI_SIGNING_* absents : pas d'artefacts de mise à jour."
          fi
      - run: npm ci
      - name: Build Tauri
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/game
          # Sans « -- » final : tauri-action insère lui-même « -- » avant `args` avec npm
          # (sinon `--target` partirait à cargo au lieu de la CLI Tauri).
          tauriScript: npm run tauri
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}
          releaseId: ${{ needs.release.outputs.id }}
          # latest.json (fusionné par chaque job de la matrice) : l'installeur NSIS pour Windows,
          # celui d'itch.io (le MSI renvoie vers itch.io, D18).
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            apps/game/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/game/src-tauri/target/release/bundle/deb/*.deb
            apps/game/src-tauri/target/release/bundle/rpm/*.rpm
            apps/game/src-tauri/target/release/bundle/nsis/*.exe
            apps/game/src-tauri/target/release/bundle/msi/*.msi
            apps/game/src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  android:
    name: android (APK/AAB)
    needs: release
    if: >-
      ${{ !cancelled() && needs.release.result != 'failure' &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[tauri]') ||
      contains(github.event.head_commit.message, '[itch]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # SDK Android préinstallé sur l'image (ANDROID_HOME) : android-actions/setup-android@v3
      # échoue (`sdkmanager tools` : paquet « tools » retiré du dépôt Google).
      - name: SDK Android (préinstallé) + NDK
        run: |
          test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          fi
          echo "sdkmanager : $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platform-tools" "ndk;${NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/game/src-tauri -> target
          key: android
      - run: npm ci
      - name: Secrets de signature présents ?
        id: signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEY_ALIAS" ] \
             && [ -n "$ANDROID_KEY_PASSWORD" ] && [ -n "$ANDROID_STORE_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets Android absents : APK debug seulement (non publiable)."
          fi
      # gen/android n'est pas versionné : il est régénéré ici, puis reçoit les icônes.
      - name: Projet Android (tauri android init)
        working-directory: apps/game
        run: |
          npm run tauri -- android init --ci
          npm run tauri:icons
          # Barres système hors du jeu (Android 15 bord à bord) : notre MainActivity.
          dest=$(find src-tauri/gen/android/app/src/main -name MainActivity.kt)
          test -n "$dest" && cp src-tauri/android/MainActivity.kt "$dest"
      - name: Version
        id: version
        run: echo "value=$(node -p "require('./apps/game/package.json').version")" >> "$GITHUB_OUTPUT"
      # versionCode : numéro d'exécution (strictement croissant, exigé par le Play Store).
      - name: Build release (non signé) + signature
        if: steps.signing.outputs.signed == 'true'
        working-directory: apps/game
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          npm run tauri -- android build --apk --aab \
            --config '{"bundle":{"android":{"versionCode":${{ github.run_number }}}}}'
          bash ../../scripts/android-sign.sh src-tauri/gen/android ../../android-out "${{ steps.version.outputs.value }}"
      # Sans secrets : APK release NON SIGNÉ, à signer hors CI avec scripts/android-sign.sh
      # (même keystore), plus un APK debug pour tester tout de suite.
      - name: Build release non signé + debug (sans secrets)
        if: steps.signing.outputs.signed != 'true'
        working-directory: apps/game
        run: |
          npm run tauri -- android build --apk \
            --config '{"bundle":{"android":{"versionCode":${{ github.run_number }}}}}'
          mkdir -p ../../android-out
          find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' \
            -exec cp {} "../../android-out/arbre-aux-absents-${{ steps.version.outputs.value }}-unsigned.apk" \;
          # Le runner manque de place pour deux builds Rust complets : on libère la cible
          # release, puis l'APK debug ne vise que arm64 (tous les téléphones récents).
          rm -rf src-tauri/target/*-linux-android*/release
          npm run tauri -- android build --apk --debug --target aarch64 \
            --config '{"bundle":{"android":{"versionCode":${{ github.run_number }}}}}'
          find src-tauri/gen/android/app/build/outputs/apk -name '*-debug.apk' \
            -exec cp {} "../../android-out/arbre-aux-absents-${{ steps.version.outputs.value }}-debug.apk" \;
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android-out/
          if-no-files-found: error
          retention-days: 14
      # APK et AAB signés seulement : l'APK est celui que le jeu propose sur Android (D18) ; jamais
      # d'APK debug ou non signé dans une release publique.
      - name: Ajout à la release brouillon
        if: needs.release.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          if [ "$SIGNED" = true ]; then
            gh release upload "$TAG" android-out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "::notice::APK non signé : rien n'est ajouté à la release $TAG."
          fi

  # Publication de la release (D18) : seulement avec les secrets TAURI_SIGNING_*, si les trois
  # builds desktop ont réussi et si latest.json couvre Windows, macOS (Intel et Apple Silicon) et
  # Linux. Réécrit latest.json (URLs du tag, notes FR/EN du journal), puis draft=false + latest.
  # Android en échec n'empêche pas la publication (le jeu Android renvoie alors vers itch.io).
  publish:
    name: release publiée (mise à jour)
    needs: [release, desktop, android]
    if: >-
      ${{ !cancelled() && needs.release.outputs.updater == 'true' &&
      needs.release.outputs.id != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Builds desktop réussis ?
        env:
          DESKTOP: ${{ needs.desktop.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          if [ "$DESKTOP" != success ]; then
            echo "::error::Builds desktop en échec ($DESKTOP) : la release reste en brouillon."
            exit 1
          fi
          [ "$ANDROID" = success ] || echo "::warning::Build Android en échec : release publiée sans APK."
      - name: latest.json (URLs, notes) puis publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.release.outputs.id }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/releases"
          gh api "$api/$ID" --jq '.assets[] | "\(.id) \(.name)"' > "$RUNNER_TEMP/assets.txt"
          asset=$(awk '$2 == "latest.json" { print $1 }' "$RUNNER_TEMP/assets.txt")
          if [ -z "$asset" ]; then
            echo "::error::latest.json absent de la release $TAG : elle reste en brouillon."
            exit 1
          fi
          gh api -H 'Accept: application/octet-stream' "$api/assets/$asset" > "$RUNNER_TEMP/in.json"
          node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          mkdir -p "$RUNNER_TEMP/out"
          node - "$RUNNER_TEMP/in.json" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/assets.txt" "$RUNNER_TEMP/out/latest.json" <<'NODE'
          const fs = require('node:fs');
          const [input, notesFile, assetsFile, output] = process.argv.slice(2);
          const { TAG, GITHUB_REPOSITORY } = process.env;
          const manifest = JSON.parse(fs.readFileSync(input, 'utf8'));
          const names = new Set(
            fs.readFileSync(assetsFile, 'utf8').split('\n').map((l) => l.slice(l.indexOf(' ') + 1)),
          );
          const required = ['windows-x86_64', 'darwin-aarch64', 'darwin-x86_64', 'linux-x86_64'];
          const missing = required.filter((k) => !manifest.platforms?.[k]);
          if (missing.length) throw new Error(`latest.json incomplet : ${missing.join(', ')}`);
          for (const [key, p] of Object.entries(manifest.platforms)) {
            const name = decodeURIComponent(new URL(p.url).pathname.split('/').pop());
            if (!names.has(name)) throw new Error(`${key} : ${name} absent de la release`);
            if (!p.signature) throw new Error(`${key} : signature vide`);
            p.url = `https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${encodeURIComponent(name)}`;
          }
          manifest.version = TAG.replace(/^v/, '');
          manifest.notes = fs.readFileSync(notesFile, 'utf8');
          fs.writeFileSync(output, `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(`latest.json : ${Object.keys(manifest.platforms).join(', ')}`);
          NODE
          gh release upload "$TAG" "$RUNNER_TEMP/out/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
          gh api -X PATCH "$api/$ID" -F draft=false -f make_latest=true \
            -F body=@"$RUNNER_TEMP/notes.md" --jq '"Publiée : \(.html_url)"'

  # Sur un tag v*, ou un commit dont le message contient « [itch] » (une session Claude ne peut
  # pas pousser de tag) : envoi sur itch.io avec butler (docs/ITCH.md §7). Sauté sans le secret
  # BUTLER_API_KEY ; le canal android est sauté si l'APK n'a pas pu être signé.
  itch:
    name: itch.io (butler)
    needs: [desktop, android]
    if: >-
      ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[itch]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: cardorinteractive/arbre-aux-absents
    steps:
      - name: Clé butler présente ?
        id: key
        run: |
          if [ -n "$BUTLER_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Secret BUTLER_API_KEY absent : rien n'est envoyé sur itch.io."; fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.key.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Zip web (index.html à la racine)
        if: steps.key.outputs.ok == 'true'
        run: |
          npm ci
          npm run package:itch
      - uses: actions/download-artifact@v5
        if: steps.key.outputs.ok == 'true'
        with:
          path: artefacts
      - name: butler
        if: steps.key.outputs.ok == 'true'
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          mkdir -p "$HOME/.butler" && unzip -q butler.zip -d "$HOME/.butler"
          chmod +x "$HOME/.butler/butler" && echo "$HOME/.butler" >> "$GITHUB_PATH"
      - name: Envoi
        if: steps.key.outputs.ok == 'true'
        run: |
          cp dist/itch/arbre-aux-absents-web.zip artefacts/
          butler -V
          sh scripts/itch-push.sh --channels "html5 windows macos linux android" artefacts "$ITCH_TARGET"
