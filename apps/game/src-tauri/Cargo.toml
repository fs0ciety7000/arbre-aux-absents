[package]
name = "arbre-aux-absents"
version = "1.3.0"
description = "L'Arbre aux absents : jeu d'enquête généalogique (CM Interactive, CM Creative Lab)."
authors = ["CM Interactive"]
license = "LicenseRef-Proprietary"
publish = false
edition = "2021"
rust-version = "1.90"

# Bibliothèque obligatoire pour les cibles mobiles (Android charge `libarbre_aux_absents_lib.so`).
[lib]
name = "arbre_aux_absents_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Aucune commande Rust maison (ARCHITECTURE §2) : le shell n'expose que les plugins fs, dialog et
# opener (liens externes limités au site et à la page itch.io, capabilities/default.json, D11).
tauri = { version = "2.12", features = [] }
tauri-plugin-fs = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
