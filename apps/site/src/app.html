<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    %sveltekit.head%
  </head>
  <body>
    <!-- Site prérendu : chaque lien charge le document prérendu (data-sveltekit-reload). Sans cela,
         les pages hydratées (carte, signalement) rendaient les autres pages côté client, alors
         qu'elles ne sont prévues que pour le prérendu (csr = false) : l'accueil levait une erreur
         et affichait la page 500. -->
    <div style="display: contents" data-sveltekit-reload>%sveltekit.body%</div>
  </body>
</html>
